version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: apex_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: apex_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/apex_health_db
      - JWT_SECRET=apex_health_jwt_secret_key_2026_super_secure
    depends_on:
      - mongodb

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: apex_client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
